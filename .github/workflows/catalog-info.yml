name: catalog-info
on:
  pull_request:
    paths:
      - '**/catalog-info.yaml'
      - '.github/workflows/catalog-info.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: kubernetes-arm-default
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: seontechnologies/seon-gh-actions/validate-catalog-info@v3
